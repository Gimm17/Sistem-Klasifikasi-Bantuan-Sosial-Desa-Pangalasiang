e="16">Layak / Tidak Layak</text><line x1="600" y1="570" x2="600" y2="590" stroke="black" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="595" width="700" height="70" fill="white" stroke="black" stroke-width="2"/><text x="600.0" y="635" text-anchor="middle" font-family="Arial" font-size="16">6. SIMPAN HASIL</text><text x="600.0" y="663" text-anchor="middle" font-family="Arial" font-size="16">Breakdown Probabilitas</text><text x="600.0" y="691" text-anchor="middle" font-family="Arial" font-size="16">Pending Approval</text>
