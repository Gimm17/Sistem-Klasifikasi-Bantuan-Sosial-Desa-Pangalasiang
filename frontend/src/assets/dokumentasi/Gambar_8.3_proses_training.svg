<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="100%" height="100%" fill="white"/>
<text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold">Proses Training Model Naive Bayes</text>
<rect x="70" y="300" width="220" height="180" fill="white" stroke="black" stroke-width="2"/><text x="180.0" y="340" text-anchor="middle" font-family="Arial" font-size="16">1. Kumpulkan Data Training</text><text x="180.0" y="368" text-anchor="middle" font-family="Arial" font-size="16">120 Data</text><text x="180.0" y="396" text-anchor="middle" font-family="Arial" font-size="16">60 Layak, 60 Tidak Layak</text><line x1="290" y1="390" x2="330" y2="390" stroke="black" stroke-width="3" marker-end="url(#a)"/><rect x="350" y="300" width="220" height="180" fill="white" stroke="black" stroke-width="2"/><text x="460.0" y="340" text-anchor="middle" font-family="Arial" font-size="16">2. Hitung Probabilitas Prior</text><text x="460.0" y="368" text-anchor="middle" font-family="Arial" font-size="16">P(C)=count(C)/total</text><line x1="570" y1="390" x2="610" y2="390" stroke="black" stroke-width="3" marker-end="url(#a)"/><rect x="630" y="300" width="220" height="180" fill="white" stroke="black" stroke-width="2"/><text x="740.0" y="340" text-anchor="middle" font-family="Arial" font-size="16">3. Hitung Likelihood</text><text x="740.0" y="368" text-anchor="middle" font-family="Arial" font-size="16">P(Xᵢ|C), α=1</text><line x1="850" y1="390" x2="890" y2="390" stroke="black" stroke-width="3" marker-end="url(#a)"/><rect x="910" y="300" width="220" height="180" fill="white" stroke="black" stroke-width="2"/><text x="1020.0" y="340" text-anchor="middle" font-family="Arial" font-size="16">4. Simpan Model</text><text x="1020.0" y="368" text-anchor="middle" font-family="Arial" font-size="16">model_probabilitas</text><text x="1020.0" y="396" text-anchor="middle" font-family="Arial" font-size="16">model_versions</text>
</svg>